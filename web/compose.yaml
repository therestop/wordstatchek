services:
  api:
    build:
      context: ..
      dockerfile: web/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://wordstatchek:${POSTGRES_PASSWORD}@postgres:5432/wordstatchek
      REDIS_URL: redis://redis:6379/0
      DATA_DIR: /data
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - results:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

  worker:
    build:
      context: ..
      dockerfile: web/Dockerfile
    command: rq worker --url redis://redis:6379/0 wordstat
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://wordstatchek:${POSTGRES_PASSWORD}@postgres:5432/wordstatchek
      REDIS_URL: redis://redis:6379/0
      DATA_DIR: /data
    volumes:
      - results:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: wordstatchek
      POSTGRES_USER: wordstatchek
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wordstatchek -d wordstatchek"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres:
  redis:
  results:
